  # ------------------------------------------------ receivables & impairment --

  receivable_write_off_threshold:
    value: 25000
    unit: USD
    pattern: 'write-off of a receivable above USD ([\d,]+)'
    referenced_by: [PG-0028]

  impairment_underperformance_pct:
