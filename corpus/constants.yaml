    pattern: 'accrual threshold of USD ([\d,]+)'
    referenced_by: [PG-0015, PG-0016]

  je_independent_review_threshold:
    value: 250000
    unit: USD
    pattern: 'journal entries above USD ([\d,]+)'
    referenced_by: [PG-0017]

  je_cfo_countersignature_threshold:
    value: 1000000
    unit: USD
    pattern: 'countersignature by the Chief Financial Officer for entries above USD ([\d,]+)'
    referenced_by: [PG-0017]

  intercompany_mismatch_tolerance:
    value: 1000
    unit: USD
    pattern: 'intercompany mismatch tolerance of USD ([\d,]+)'
    referenced_by: [PG-0018, PG-0019]

  performance_materiality:
