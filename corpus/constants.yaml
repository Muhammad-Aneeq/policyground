    value: 30
    unit: days
    pattern: 'within ([\d]+) days of the expense being incurred'
    referenced_by: [PG-0006, PG-0010]

  receipt_required_above:
    value: 25
    unit: USD
    pattern: 'itemised receipt is required for any single item above USD ([\d,]+)'
    referenced_by: [PG-0006, PG-0010]

  hotel_cap_standard:
    value: 250
    unit: USD
