# corpus/constants.yaml — the single source of truth for every number that appears in more
# than one policy (PLAN.md D-011).
#
# WHY THIS FILE EXISTS
# A 30-document policy manual is only credible if a threshold quoted in the Capitalisation
# Policy is the same threshold quoted in the Approval Matrix. Proof-reading does not scale and
# does not survive edits. So each shared fact is declared once here with a regex, and
# `pg corpus check` enforces three invariants across the whole corpus:
#
#   COVERAGE  every policy listed in `referenced_by` contains at least one match of `pattern`
#   AGREEMENT every match of `pattern` anywhere in the corpus captures exactly `value`
#   NO-ORPHAN every policy where `pattern` matches is listed in `referenced_by`
#
# AGREEMENT is the one that matters: it is what makes a threshold drifting between two documents
# a failing test instead of a reader's problem. COVERAGE catches a reference silently deleted
# during an edit; NO-ORPHAN catches a policy quoting a shared number without being registered.
#
# Regex notes: `pattern` must contain exactly one capture group, wrapping the number only.
# Numbers may be written with thousands separators in prose; the checker normalises before
# comparing. Matching is case-insensitive and treats runs of whitespace as equivalent, so a
# phrase may wrap across lines in the markdown.

entity: Calder Meridian Group
reporting_currency: USD
framework_note: >-
  IFRS-aligned group accounting manual. All content is synthetic and written in the authors'
  own words; no accounting standard text is reproduced.

constants:

  # ------------------------------------------------------- capitalisation --

  capitalisation_threshold_general:
    value: 5000
    unit: USD
    description: Minimum unit cost for an item of PP&E to be capitalised rather than expensed.
    pattern: 'general capitalisation threshold of USD ([\d,]+)'
    referenced_by: [PG-0003, PG-0004, PG-0007, PG-0015]

  capitalisation_threshold_it:
    value: 1000
    unit: USD
    description: Lower threshold for IT end-user hardware, which is tracked for security reasons.
    pattern: 'IT equipment capitalisation threshold of USD ([\d,]+)'
    referenced_by: [PG-0003, PG-0004]

  capitalisation_threshold_leasehold:
    value: 25000
    unit: USD
    description: Threshold for leasehold improvements, set higher because small fit-out spend is routine.
    pattern: 'leasehold improvement capitalisation threshold of USD ([\d,]+)'
    referenced_by: [PG-0003, PG-0004]

  software_capitalisation_threshold:
    value: 10000
    unit: USD
    description: Minimum project cost before internally developed software may be capitalised.
    pattern: 'software capitalisation threshold of USD ([\d,]+)'
    referenced_by: [PG-0003, PG-0005]

  low_value_lease_threshold:
    value: 5000
    unit: USD
    description: Underlying-asset value below which the low-value lease exemption may be taken.
    pattern: 'low-value lease threshold of USD ([\d,]+)'
    referenced_by: [PG-0003, PG-0027]

  fixed_asset_disposal_threshold:
    value: 50000
    unit: USD
    description: NBV above which a disposal or write-off needs Finance Director sign-off.
    pattern: 'net book value above USD ([\d,]+)'
    referenced_by: [PG-0004, PG-0007]

  useful_life_it_hardware_years:
    value: 3
    unit: years
    pattern: 'IT hardware is depreciated over ([\d]+) years'
    referenced_by: [PG-0003, PG-0004]

  useful_life_buildings_years:
    value: 40
    unit: years
    pattern: 'buildings are depreciated over ([\d]+) years'
    referenced_by: [PG-0004]

  # --------------------------------------------------- delegation of authority --

  doa_band_cost_centre_manager:
    value: 5000
    unit: USD
    pattern: 'Cost Centre Manager may approve commitments up to USD ([\d,]+)'
    referenced_by: [PG-0007, PG-0008]

  doa_band_department_head:
    value: 25000
    unit: USD
    pattern: 'Department Head may approve commitments up to USD ([\d,]+)'
    referenced_by: [PG-0007]

  doa_band_finance_director:
    value: 100000
    unit: USD
    pattern: 'Finance Director may approve commitments up to USD ([\d,]+)'
    referenced_by: [PG-0007]

  doa_band_cfo:
    value: 500000
    unit: USD
    pattern: 'Chief Financial Officer may approve commitments up to USD ([\d,]+)'
    referenced_by: [PG-0007]

  doa_band_ceo:
    value: 2000000
    unit: USD
    description: Above this, Board approval is required; there is no higher individual band.
    pattern: 'Chief Executive Officer may approve commitments up to USD ([\d,]+)'
    referenced_by: [PG-0007]

  # ---------------------------------------------- procurement & payables --

  po_required_above:
    value: 2500
    unit: USD
    pattern: 'purchase order is required for any commitment above USD ([\d,]+)'
    referenced_by: [PG-0006, PG-0008, PG-0009]

  three_way_match_tolerance_pct:
    value: 2
    unit: per cent
    pattern: 'three-way match tolerance of ([\d.]+) per cent'
    referenced_by: [PG-0008, PG-0009]

  three_way_match_tolerance_abs:
    value: 50
    unit: USD
    description: The absolute cap that applies alongside the percentage tolerance.
    pattern: 'or USD ([\d,]+), whichever is lower'
    referenced_by: [PG-0008, PG-0009]

  duplicate_invoice_window_days:
    value: 90
    unit: days
    pattern: 'duplicate-invoice review window of ([\d]+) days'
    referenced_by: [PG-0009]

  payment_terms_standard_days:
    value: 45
    unit: days
    pattern: 'standard payment terms of Net ([\d]+)'
    referenced_by: [PG-0008, PG-0009]

  # --------------------------------------------------- travel & expenses --

